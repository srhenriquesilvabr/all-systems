<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palmer Tech · Gestão</title>
    <link rel="icon" href="/brand/palmer-icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/palmer-simbolo-blue.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/palmer-icon-180.png" />
    <meta name="theme-color" content="#0e1330" />
    <script>
      // Tema antes da primeira pintura (evita piscar claro no tema escuro). Mesma regra de src/layout/theme.ts.
      try {
        var t = localStorage.getItem('palmer:theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
      // Cor da última empresa aberta, também antes da primeira pintura. Mesmo CSS de brandCss()
      // em packages/ui/src/brand.ts. Páginas públicas (/agendar/…) usam a cor da empresa delas.
      try {
        var brand = location.pathname.indexOf('/agendar/') === 0 ? null : JSON.parse(localStorage.getItem('palmer:brand') || 'null');
        if (brand && brand.light && brand.dark) {
          var valid = true;
          var rule = function (selector, scale) {
            var vars = '';
            for (var shade in scale) {
              if (!/^\d{2,3}$/.test(shade) || !/^#[0-9a-f]{6}$/i.test(scale[shade])) valid = false;
              vars += '--color-brand-' + shade + ':' + scale[shade] + ';';
            }
            return selector + '{' + vars + '}';
          };
          var css = rule(':root:root', brand.light) + rule(":root:root[data-theme='dark']", brand.dark);
          if (valid) {
            var style = document.createElement('style');
            style.id = 'brand-palette';
            style.textContent = css;
            document.head.appendChild(style);
          }
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
