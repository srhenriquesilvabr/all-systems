<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palmer Tech · Gestão</title>
    <link rel="icon" href="/brand/palmer-icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/palmer-simbolo-blue.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/palmer-icon-180.png" />
    <meta name="theme-color" content="#0e1330" />
    <script>
      // Tema antes da primeira pintura (evita piscar claro no tema escuro). Mesma regra de src/layout/theme.ts.
      try {
        var t = localStorage.getItem('palmer:theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
