name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allsystems_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://app_user:app_user@localhost:5432/allsystems_test
      TEST_MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/allsystems_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Papel da aplicação (sem superuser/BYPASSRLS)
        run: psql postgres://postgres:postgres@localhost:5432/allsystems_test -c "CREATE ROLE app_user LOGIN PASSWORD 'app_user' NOSUPERUSER NOBYPASSRLS;"

      - run: pnpm check:boundaries
      - run: pnpm build
      - run: pnpm typecheck
      - name: Testes (inclui isolamento por RLS)
        run: pnpm test
